name: Deploy Code Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-docs:
    name: Generate & Publish API Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build Solution with XML Documentation
        run: dotnet build HomeManagement.slnx --configuration Release

      - name: Generate Static HTML Documentation Site
        shell: pwsh
        run: ./scripts/generate-docs.ps1 -Configuration Release -OutputDir ./_site

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-documentation-site
          path: ./_site

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(pages): publish generated code documentation"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
