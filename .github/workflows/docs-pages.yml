name: Deploy Code Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-docs:
    name: Generate & Publish API Documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build Solution with XML Documentation
        run: dotnet build HomeManagement.slnx --configuration Release

      - name: Generate Static HTML Documentation Site
        shell: pwsh
        run: ./scripts/generate-docs.ps1 -Configuration Release -OutputDir ./_site

      - name: Update gh-pages Branch
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(pages): publish generated code documentation"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf .git

      - name: Configure GitHub Pages (Auto-Enable)
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_config.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
